[package]
name = "docsee"
version = "0.2.0"
edition = "2021"
description = "PDF and image text extraction: native text via pdfium with tesseract OCR fallback"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rubysolo/docsee"
readme = "README.md"
keywords = ["pdf", "ocr", "text-extraction", "tesseract", "pdfium"]
categories = ["text-processing", "command-line-utilities"]

[lib]
name = "docsee"
path = "src/lib.rs"

[[bin]]
name = "docsee"
path = "src/main.rs"

[features]
# Wrap every pdfium FFI call in a lock. Enable when embedding the engine in a
# host process that calls it from more than one OS thread.
thread-safe-pdfium = ["pdfium-render/thread_safe"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
pdfium-render = { version = "0.8", features = ["image"] }
leptess = "0.14"
